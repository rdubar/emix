[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emix-shell"
version = "0.1.0"
description = "Retro computer personalities backed by a modern Unix host"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
emix = "emix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
